    <path d="M100 159l-12-7m16 9-10 4m-2 24-11 2m11-2-6 9m4 8-9 7m9-7-2 11m3 16-8 7m8-7 1 11m19-32-8 8m8-8 1 12m-1 18-7 8m7-8 2 10m14-28-7 8m7-8 2 11m17-31-8 7m8-7 2 11m8-17-7 9m14-8 7 9m-7 12-6 10m6-10 5 10m-6 14-6 11m6-11 5 11m13-30 7 8m-7-8-2 11m17-16 8 8m-8-8-1 11m20-2 8 8m-8-8-1 11m18-9 9 7m-9-7 1 11m18-2 10 4m-10-4 5 9m11 5 11 2m-11-2 7 9m-4 13 9 7m-9-7 2 11m-19-30 8 8m-8-8-1 12m-12 14 7 8m-7-8-2 11m-13 1 7 9m-7-9-3 11" stroke-width="1.2" opacity="0.78"/>
