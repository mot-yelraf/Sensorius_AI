<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="61 61 390 390" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Biodynamic Calendar app icon</title>
  <desc id="desc">Root, leaf, flower, and grape symbols on earth, water, air, and fire quadrants surrounding a crescent moon.</desc>

  <defs>
