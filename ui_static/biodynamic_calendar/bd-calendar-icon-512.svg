    <rect x="256" y="74" width="182" height="182" fill="#2f6eb8"/>
    <rect x="74" y="256" width="182" height="182" fill="#d64b3b"/>
    <rect x="256" y="256" width="182" height="182" fill="#c4dcf8"/>
  </g>

