<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Biodynamic Calendar favicon</title>
  <desc id="desc">A four-part biodynamic wheel for root, leaf, flower, and fruit days surrounding a crescent moon.</desc>

  <rect width="512" height="512" rx="104" fill="#fff"/>

  <!-- Root -->
  <path d="M165 112v55m0 0-31 31m31-31 31 31m-31-12-20 32m20-32 20 32"
        fill="none" stroke="#d1a542" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leaf -->
  <path d="M292 206c7-48 34-66 64-69-1 34-16 67-64 69Z" fill="#7aa84b"/>
  <path d="M296 202l40-42" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

  <!-- Flower -->
  <g fill="#f2c94c">
    <circle cx="174" cy="305" r="16"/>
    <circle cx="147" cy="325" r="16"/>
    <circle cx="157" cy="356" r="16"/>
    <circle cx="191" cy="356" r="16"/>
    <circle cx="201" cy="325" r="16"/>
  </g>
  <circle cx="174" cy="332" r="11" fill="#fff"/>

  <!-- Fruit -->
  <path d="M301 334c0-24 17-37 39-37s39 13 39 37c0 32-17 49-39 49s-39-17-39-49Z" fill="#c84f3d"/>
  <path d="M340 298c2-15 11-24 26-26-2 16-11 24-26 26Z" fill="#7aa84b"/>

  <!-- Wheel overlays the plant parts to keep each symbol inside its quadrant. -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#27313a" stroke-width="28"/>
  <path d="M256 78v356M78 256h356" fill="none" stroke="#27313a" stroke-width="22"/>

  <!-- Lunar center -->
  <circle cx="256" cy="256" r="63" fill="#fff" stroke="#27313a" stroke-width="22"/>
  <circle cx="250" cy="256" r="35" fill="#d1a542"/>
  <circle cx="266" cy="243" r="35" fill="#fff"/>
</svg>
