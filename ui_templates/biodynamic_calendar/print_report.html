<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biodynamic Calendar Report</title>
  <link rel="stylesheet" href="/ui_static/biodynamic_calendar/app.css?v={{ app_version }}">
  <style>
    body { background: #fff; }
    .print-window-toolbar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: flex-end; padding: 10px 20px; background: #fff; border-bottom: 1px solid #d9ceb0; }
    .print-window-toolbar button { padding: 8px 14px; }
    .print-report { display: block !important; }
    .print-report-error { padding: 24px; }
    @media print { .print-window-toolbar { display: none !important; } }
  </style>
</head>
<body>
  <div class="print-window-toolbar"><button type="button" id="printWindowBtn">Print Report</button></div>
  <main class="page">
    <section id="stagedPrintReport" class="print-report" aria-live="polite"></section>
  </main>
  <script type="module" src="/ui_static/biodynamic_calendar/print_report.js?v={{ app_version }}"></script>
</body>
</html>
