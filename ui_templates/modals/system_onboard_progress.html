<!-- ui_templates/modals/system_onboard_progress.html -->

<style>
.onboard-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.onboard-modal {
  background: #fff;
  min-width: 420px;
  max-width: 560px;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  padding: 18px 18px 12px;
}
.onboard-title {
  font-weight: 600;
  font-size: 1.1rem;
  margin-bottom: 10px;
}
.onboard-steps {
  list-style: none;
  padding: 0;
  margin: 0;
}
.step {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px;
  border-radius: 6px;
  margin-bottom: 6px;
  background: #f7f7f7;
}
.step .icon {
  font-weight: 700;
  margin-right: 6px;
}
.step.pass {
  background: #eef9f0;
}
.step.pass .icon {
  color: #2a8c4a;
}
.step.fail {
  background: #fdeeee;
}
.step.fail .icon {
  color: #b3212d;
}
.detail {
  font-size: .88rem;
  color: #444;
}
.onboard-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}
.onboard-actions button[disabled] {
  opacity: .6;
  cursor: not-allowed;
}

/* Button standards (same palette as other system_* modals) */
.button {
  display: inline-block;
  padding: 10px 20px;
  margin: 10px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s;
}
.button:hover {
  transform: translateY(0px);
}
.green   { background-color: #28a745; color: white; }
.green:hover { background-color: #218838; }
.red     { background-color: #dc3545; color: white; }
.red:hover { background-color: #c82333; }
.neutral { background-color: #f7f1c1; color: #212529; }
.neutral:hover { background-color: #f7efb0; }
.black   { background-color: #000; color: white; }
.black:hover { background-color: #333; }
.yellow  { background-color: #ffc107; color: #212529; }
.yellow:hover { background-color: #e0a800; }
.blue    { background-color: #2259f2; color: white; }
.blue:hover { background-color: blue; }
</style>

<div id="onboard-progress-overlay"
     class="onboard-overlay"
     style="display:none;">
  <div class="onboard-modal">
    <div class="onboard-title">Adding Device</div>
    <ul class="onboard-steps">
      <li id="step-1" class="step pending">
        <span class="icon">•</span>
        <span class="label">
          Adding Device, this can take up to 30 seconds
        </span>
        <div class="detail" id="step-1-detail"></div>
      </li>
      <li id="step-2" class="step pending">
        <span class="icon">•</span>
        <span class="label">Sensor Setup connection established</span>
        <div class="detail" id="step-2-detail"></div>
      </li>
      <li id="step-3" class="step pending">
        <span class="icon">•</span>
        <span class="label">
          <span id="step-3-sensor">...</span> configured and rebooting
        </span>
        <div class="detail" id="step-3-detail"></div>
      </li>
      <li id="step-4" class="step pending">
        <span class="icon">•</span>
        <span class="label">
          Reconnecting to <span id="step-4-ssid">...</span>
        </span>
        <div class="detail" id="step-4-detail"></div>
      </li>
    </ul>
    <div class="onboard-actions">
      <button id="onboard-ok"
              class="button black"
              disabled
              title="Close onboarding progress"
              onclick="closeOnboardModal()">
        OK
      </button>
    </div>
  </div>
</div>

<script>
let _onboardWS = null;
let _onboardJob = "";

function openOnboardModal() {
  const ov = document.getElementById("onboard-progress-overlay");
  if (ov) ov.style.display = "flex";
}

function closeOnboardModal() {
  const ov = document.getElementById("onboard-progress-overlay");
  if (ov) ov.style.display = "none";
}

function _setIcon(li, state) {
  const ic = li.querySelector(".icon");
  if (!ic) return;
  if (state === "pass") {
    ic.textContent = "✓";
  } else if (state === "fail") {
    ic.textContent = "✕";
  } else {
    ic.textContent = "•";
  }
}

function _mark(step, ok, label, detail) {
  const li = document.getElementById(`step-${step}`);
  if (!li) return;

  li.classList.remove("pending", "pass", "fail");
  li.classList.add(ok ? "pass" : "fail");
  _setIcon(li, ok ? "pass" : "fail");

  if (label) {
    const lab = li.querySelector(".label");
    if (lab) lab.textContent = label;
  }
  if (detail) {
    const det = document.getElementById(`step-${step}-detail`);
    if (det) det.textContent = detail;
  }

  // updated step-specific label targets (shifted by +1)
  if (step === 3 && label) {
    const seg = label.split(" configured")[0];
    const tgt = document.getElementById("step-3-sensor");
    if (tgt) tgt.textContent = seg || "...";
  }
  if (step === 4 && label) {
    const m = label.match(/Reconnecting to\s+(.+)/);
    if (m) {
      const tgt = document.getElementById("step-4-ssid");
      if (tgt) tgt.textContent = m[1];
    }
  }
}

function _enableOK() {
  const b = document.getElementById("onboard-ok");
  if (b) b.disabled = false;
}

async function startOnboardFromSetup(formEl) {
  try {
    openOnboardModal();

    // reset step UI for 4 steps
    for (let i = 1; i <= 4; i++) {
      const li = document.getElementById(`step-${i}`);
      if (li) {
        li.classList.remove("pass", "fail");
        li.classList.add("pending");
        _setIcon(li, "pending");
      }
      const det = document.getElementById(`step-${i}-detail`);
      if (det) det.textContent = "";
    }

    const okBtn = document.getElementById("onboard-ok");
    if (okBtn) okBtn.disabled = true;

    const fd = new FormData(formEl);
    const res = await fetch("/onboard-device", { method: "POST", body: fd });

    if (!res.ok) {
      _mark(1, false, "Failed to start onboarding", "HTTP " + res.status);
      _enableOK();
      return false;
    }

    const js = await res.json();
    _onboardJob = js.job_id;

    const proto = (location.protocol === "https:") ? "wss" : "ws";
    _onboardWS = new WebSocket(`${proto}://${location.host}/ws/onboard/${_onboardJob}`);

    _onboardWS.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.hello) return;

        // If backend still sends old steps (1..3), map them to (2..4)
        let step = msg.step;
        if (step === 1 || step === 2 || step === 3) {
          step = step + 1;
        }

        if (typeof msg.step === "number") {
          _mark(step, !!msg.ok, msg.label || "", msg.detail || "");
        }
        if (msg.done) {
          _enableOK();
        }
      } catch (e) {
        console.error(e);
      }
    };

    _onboardWS.onerror = () => {
      _mark(1, false, "Progress channel error", "");
      _enableOK();
    };

    // Immediately mark new step-1 as started
    _mark(1, true, "Adding Device, this can take up to 30 seconds", "");
  } catch (e) {
    console.error(e);
    _mark(1, false, "Error starting onboarding", String(e));
    _enableOK();
  }
  return false;
}
</script>
