<!-- ui_templates/modals/system_remove_device.html -->

<style>
.remove-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 4px;
  border-radius: 6px;
}
.remove-item:hover {
  background: #f0f4ff;
}
.remove-none {
  color: #666;
  padding: 6px;
}
#remove-device-overlay .sai-live-status {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

/* Button standards (kept local for now; can be dropped once fully in app.css) */
.button {
  display: inline-block;
  padding: 10px 20px;
  margin: 10px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s;
}
.button:hover {
  transform: translateY(0px);
}
.green   { background-color: #28a745; color: white; }
.green:hover { background-color: #218838; }
.red     { background-color: #dc3545; color: white; }
.red:hover { background-color: #c82333; }
.neutral { background-color: #f7f1c1; color: #212529; }
.neutral:hover { background-color: #f7efb0; }
.black   { background-color: #000; color: white; }
.black:hover { background-color: #333; }
.yellow  { background-color: #ffc107; color: #212529; }
.yellow:hover { background-color: #e0a800; }
.blue    { background-color: #2259f2; color: white; }
.blue:hover { background-color: blue; }
</style>

<div id="remove-device-overlay"
     class="onboard-overlay"
     style="display:none;">
  <div class="onboard-modal" style="min-width:520px;">
    <div class="onboard-title">Remove Device(s)</div>

    <div id="remove-device-status"
         class="sai-live-status"
         aria-live="polite"></div>

    <div id="remove-device-list"
         style="max-height:260px;overflow:auto;border:1px solid #eee;border-radius:8px;padding:8px;background:#fafafa;">
      <div class="detail">Loading devices…</div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
      <label style="font-size:.9rem;color:#333;">
        <input type="checkbox" id="remove-device-confirm">
        I understand this deletes settings and data
      </label>
      <div class="onboard-actions">
        <button id="remove-device-run"
                disabled
                class="button red"
                title="Remove selected devices"
                onclick="submitRemoveDevices()">
          Remove Selected
        </button>
        <button style="margin-left:8px"
                class="button black"
                title="Dashboard"
                onclick="closeRemoveDeviceModal()">
          Dashboard
        </button>
      </div>
    </div>
  </div>
</div>

<script>
function openRemoveDeviceModal() {
  const ov = document.getElementById("remove-device-overlay");
  if (ov) {
    ov.style.display = "flex";
    loadRemovableDevices();
  }
}

function closeRemoveDeviceModal() {
  const ov = document.getElementById("remove-device-overlay");
  if (ov) ov.style.display = "none";
}

var removeDeviceToastEl = null;
var removeDeviceToastTimer = null;

function _setRemoveStatus(msg) {
  const el = document.getElementById("remove-device-status");
  if (el) el.textContent = msg || "";
}

function formatRemoveDeviceIds(ids) {
  const clean = (ids || []).filter(Boolean);
  if (!clean.length) return "selected device";
  if (clean.length === 1) return clean[0];
  const shown = clean.slice(0, 3).join(", ");
  const extra = clean.length > 3 ? `, +${clean.length - 3} more` : "";
  return `${clean.length} devices (${shown}${extra})`;
}

function getRemoveErrorText(err) {
  if (err && err.message) return err.message;
  return String(err || "unknown error");
}

function showRemoveDeviceNotice(message, type, autoDismiss) {
  _setRemoveStatus(message || "");
  if (!message) {
    if (removeDeviceToastTimer) {
      window.clearTimeout(removeDeviceToastTimer);
      removeDeviceToastTimer = null;
    }
    if (removeDeviceToastEl) removeDeviceToastEl.remove();
    removeDeviceToastEl = null;
    return;
  }
  let container = document.querySelector(".toast-container");
  if (!container) {
    container = document.createElement("div");
    container.className = "toast-container";
    document.body.appendChild(container);
  }
  if (!removeDeviceToastEl || !removeDeviceToastEl.isConnected) {
    removeDeviceToastEl = document.createElement("div");
    container.appendChild(removeDeviceToastEl);
  } else if (removeDeviceToastEl.parentNode !== container) {
    container.appendChild(removeDeviceToastEl);
  }
  if (removeDeviceToastTimer) {
    window.clearTimeout(removeDeviceToastTimer);
    removeDeviceToastTimer = null;
  }
  removeDeviceToastEl.className = `toast remove-device-toast ${type || ""}`.trim();
  removeDeviceToastEl.textContent = message;
  if (autoDismiss) {
    removeDeviceToastTimer = window.setTimeout(() => {
      if (removeDeviceToastEl) removeDeviceToastEl.remove();
      removeDeviceToastEl = null;
      removeDeviceToastTimer = null;
      if (container && !container.children.length) container.remove();
    }, 2500);
  }
}

async function loadRemovableDevices() {
  showRemoveDeviceNotice("", "", false);
  const listEl = document.getElementById("remove-device-list");
  if (!listEl) return;

  listEl.innerHTML = "<div class=\"detail\">Loading...</div>";
  try {
    const resp = await fetch("/remove-device-list");
    const js = await resp.json();
    const devs = (js && js.devices) || [];
    const detailMap = (js && js.device_details) || {};

    if (!devs.length) {
      listEl.innerHTML = "<div class=\"remove-none\">No devices found to remove.</div>";
    } else {
      const frag = document.createDocumentFragment();
      devs.forEach(d => {
        const row = document.createElement("div");
        row.className = "remove-item";

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.value = d;
        cb.name = "device_ids";
        cb.onchange = toggleRemoveEnable;

        const lbl = document.createElement("label");
        lbl.textContent = d;
        lbl.style.cursor = "pointer";

        const meta = detailMap[d] || {};
        const detail = document.createElement("span");
        detail.className = "detail";
        const lastSeen = meta.last_seen_s == null ? "last seen unknown" : ("last seen " + meta.last_seen_s + "s ago");
        detail.textContent = [meta.url || "", lastSeen].filter(Boolean).join(" | ");

        row.appendChild(cb);
        row.appendChild(lbl);
        row.appendChild(detail);
        frag.appendChild(row);
      });
      listEl.innerHTML = "";
      listEl.appendChild(frag);
    }
  } catch (e) {
    console.error(e);
    listEl.innerHTML = "<div class=\"remove-none\">Failed to load devices.</div>";
  }
  toggleRemoveEnable();
}

function toggleRemoveEnable() {
  const anySel = [...document.querySelectorAll('#remove-device-list input[type="checkbox"]')]
    .some(x => x.checked);
  const confirmed = !!(document.getElementById("remove-device-confirm") &&
                       document.getElementById("remove-device-confirm").checked);
  const btn = document.getElementById("remove-device-run");
  if (btn) btn.disabled = !(anySel && confirmed);
}

document.addEventListener("change", (ev) => {
  if (ev && ev.target && ev.target.id === "remove-device-confirm") {
    toggleRemoveEnable();
  }
});

async function submitRemoveDevices() {
  const checked = document.querySelectorAll('#remove-device-list input[type="checkbox"]:checked');
  const ids = [...checked].map(x => x.value);
  if (!ids.length) return;

  const targetLabel = formatRemoveDeviceIds(ids);
  showRemoveDeviceNotice(`Removing ${targetLabel}...`, "", false);
  const runBtn = document.getElementById("remove-device-run");
  if (runBtn) runBtn.disabled = true;

  try {
    const resp = await fetch("/remove-device", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ device_ids: ids })
    });
    const js = await resp.json().catch(() => ({}));
    if (!resp.ok || (js && js.error)) {
      throw new Error((js && (js.error || js.message)) || ("HTTP " + resp.status));
    }
    showRemoveDeviceNotice(`Removed ${targetLabel}. Reloading dashboard...`, "ok", true);
    window.setTimeout(() => window.location.reload(), 500);
  } catch (e) {
    console.error(e);
    showRemoveDeviceNotice(`Failed to remove ${targetLabel}: ${getRemoveErrorText(e)}`, "error", true);
    toggleRemoveEnable();
  }
}
</script>
