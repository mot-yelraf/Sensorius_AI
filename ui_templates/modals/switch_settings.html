<!-- ui_templates/modals/switch_settings.html -->

<div class="modal-backdrop" style="display:none">
  <div
    class="modal"
    id="switchSettingsModal"
    data-switch-id="{{ switch_id }}"
    data-channel-indices="{{ channel_indices | join(',') }}"
    data-channel-count="{{ channel_indices | length }}"
  >
    <div class="modal-header">
      <h3 class="modal-title">Edit Switch Settings</h3>
    </div>

    <div class="modal-body">
      <h3 style="text-align:center; margin-top:0.25rem; margin-bottom:0.75rem;">
        {{ switch_id | upper }}
      </h3>

      <div class="split switch-dialog-split">
        <aside class="panel switch-dialog-menu" aria-label="Switch dialog sections">
          <button class="switch-menu-btn active" type="button" id="switchMenuSettings" aria-selected="true">
            Switch Settings
          </button>
          <button class="switch-menu-btn" type="button" id="switchMenuAutomations" aria-selected="false">
            Automations
          </button>
        </aside>

        <section class="panel switch-dialog-content">
          <div id="switchSettingsPane" class="switch-pane">
            <form method="POST" action="/submit-switch-settings">
              <input type="hidden" name="switch_id" value="{{ switch_id }}" />

              <div class="switch-form-grid">
                <div class="switch-form-col switch-form-col-left">
                  <div class="field-stack">
                    <label for="location">LOCATION</label>
                    <input
                      type="text"
                      id="location"
                      name="location"
                      required
                      value="{{ settings.Switch.SWITCH_LOCATION if settings.Switch and settings.Switch.SWITCH_LOCATION is not none else 'Unknown' }}"
                    />
                  </div>
                </div>

                <div class="switch-form-col switch-form-col-right">
                  {% for ch in channels %}
                  <div class="field-stack">
                    <label for="SWITCH_{{ ch.index }}_LABEL">Channel label for switch_{{ ch.index }}</label>
                    <input
                      type="text"
                      id="SWITCH_{{ ch.index }}_LABEL"
                      name="SWITCH_{{ ch.index }}_LABEL"
                      placeholder="Switch {{ ch.index }} label"
                      value="{{ ch.label | default('') | e }}"
                    />
                  </div>
                  {% endfor %}
                </div>
              </div>

              <div class="modal-footer switch-form-footer">
                <div class="footer-buttons">
                  <button
                    class="button black"
                    type="button"
                    onclick="window.closeSwitchSettingsModal && window.closeSwitchSettingsModal();"
                  >
                    Home
                  </button>

                  <button class="button blue" type="submit">
                    Save
                  </button>
                </div>
              </div>
            </form>
          </div>

          <div id="switchAutomationsPane" class="switch-pane" hidden>
            <div id="automationChooser" class="automation-chooser">
              <div class="list-header">
                <span>Saved Automations</span>
                <button class="button green" type="button" id="btnNewFromList">New</button>
              </div>
              <div class="list" id="automationList"></div>
              <div class="modal-footer" style="margin-top:.25rem;">
                <div class="footer-buttons">
                  <button
                    class="button black"
                    type="button"
                    data-switch-pane-target="settings"
                  >
                    Back
                  </button>
                  <button
                    class="button black"
                    type="button"
                    onclick="window.closeSwitchSettingsModal && window.closeSwitchSettingsModal();"
                  >
                    Home
                  </button>
                </div>
              </div>
            </div>

            <div id="automationEditorWrap" hidden>
              <form class="form" id="configForm" onsubmit="return false;">
                <div class="row two">
                  <div>
                    <label for="autoName">Automation Name</label>
                    <input type="text" id="autoName" placeholder="e.g., Cool when hot" />
                  </div>
                  <div class="inline" style="align-self:end; padding-bottom:.2rem;">
                    <input type="checkbox" id="autoEnabled" />
                    <label for="autoEnabled" style="margin:0">Enable</label>
                  </div>
                </div>

                <div class="section">
                  <p class="section-title">Condition(s)</p>
                  <p class="muted">Tip: set <strong>Type</strong> to <strong>or</strong> to split logic groups (AND within a group, OR between groups).</p>

                  <div class="inline" style="align-items:center; margin:.25rem 0 .5rem 0;">
                    <button class="add" type="button" id="btnAddCondition">Add Condition</button>
                  </div>

                  <div id="conditionsContainer" aria-live="polite"></div>
                </div>

                <div class="section">
                  <p class="section-title">Action(s)</p>
                  <div class="inline" style="align-items:center; margin:.25rem 0 .5rem 0;">
                    <button class="add" type="button" id="btnAddAction">Add Action</button>
                  </div>
                  <div id="actionsContainer" aria-live="polite"></div>
                </div>

                <div class="row single">
                  <button class="button green" type="button" id="btnSetAutomation">Save</button>
                </div>
                <div class="json-preview" id="jsonPreview" hidden></div>

                <div class="modal-footer" style="margin-top:.25rem;">
                  <div class="footer-buttons">
                    <button class="button black" type="button" data-switch-pane-target="settings">Back</button>
                    <button class="button black" type="button" id="btnSavedAutomations">Saved Automations</button>
                    <button class="button green" type="button" id="btnNewAutomation">New</button>
                    <button class="button red" type="button" id="btnRemove">Remove</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
