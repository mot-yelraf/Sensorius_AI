<!-- ui_templates/modals/advanced_automation.html -->
<div class="modal-backdrop" style="display:none">
  <div class="modal" id="automationManagerModal" data-switch-id="{{ switch_id }}">
    <div class="modal-header">
      <h3 class="modal-title">Manage Automations</h3>
    </div>

    <div class="modal-body">
      <div class="split">
        <!-- Left: Saved automations -->
        <aside class="panel" id="leftPanel">
          <div class="list-header">
            <span>Saved Automations</span>
          </div>
          <div class="list" id="automationList"></div>
        </aside>

        <!-- Right: Configuration pane -->
        <section class="panel" id="rightPanel">
          <form class="form" id="configForm" onsubmit="return false;">
            <!-- Top row: Name + Enable -->
            <div class="row two">
              <div>
                <label for="autoName">Automation Name</label>
                <input type="text" id="autoName" placeholder="e.g., Cool when hot" />
              </div>
              <div class="inline" style="align-self:end; padding-bottom:.2rem;">
                <input type="checkbox" id="autoEnabled" />
                <label for="autoEnabled" style="margin:0">Enable</label>
              </div>
            </div>

            <!-- Conditions -->
            <div class="section">
              <p class="section-title">Condition(s)</p>
              <p class="muted">Tip: set <strong>Type</strong> to <strong>or</strong> to split logic groups (AND within a group, OR between groups).</p>

              <div class="inline" style="align-items:center; margin:.25rem 0 .5rem 0;">
                <button class="add" type="button" id="btnAddCondition">Add Condition</button>
              </div>

              <div id="conditionsContainer" aria-live="polite"></div>
            </div>

            <!-- Actions -->
            <div class="section">
              <p class="section-title">Action</p>
              <div class="row three">
                <div>
                  <label for="actionSwitch">Switch</label>
                  <select id="actionSwitch"></select>
                </div>
                <div>
                  <label for="actionSet">Set</label>
                  <select id="actionSet">
                    <option value="on">On</option>
                    <option value="off">Off</option>
                  </select>
                </div>
                <div>
                  <label for="actionDelay">Delay (s, 0–60)</label>
                  <input id="actionDelay" type="number" min="0" max="60" step="1" value="0" />
                </div>
              </div>
            </div>

            <!-- Set button + JSON preview -->
            <div class="row single">
              <button class="button green" type="button" id="btnSetAutomation">Save</button>
            </div>
            <div class="json-preview" id="jsonPreview" hidden></div>

            <!-- Bottom buttons -->
            <div class="modal-footer" style="margin-top:.25rem;">
              <div class="footer-buttons">
                <button class="button black" type="button" id="btnOk">Back</button>
                <button class="button green" type="button" id="btnNewAutomation">New</button>
                <button class="button red" type="button" id="btnRemove">Remove</button>
              </div>
            </div>
          </form>
        </section>
      </div>
    </div>

  </div>
</div>
