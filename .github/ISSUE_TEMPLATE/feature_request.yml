name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before submitting a suggestion.
        Do not include credentials, precise coordinates, private addresses, or unredacted logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to accomplish, and what limitation are you encountering?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or capability you would like and how it would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you have considered.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note relevant platforms, hardware, integrations, settings, stored data, or existing installations.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include examples, sketches, or links that help explain the suggestion.
