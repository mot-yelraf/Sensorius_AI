[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorius"
dynamic = ["version"]
description = "Cross-platform environmental sensing and automation hub"
requires-python = ">=3.11"

[tool.setuptools.dynamic]
version = {attr = "sensorius.__init__.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["sensorius*"]

[tool.setuptools.package-data]
sensorius = ["resources/*.icns"]
