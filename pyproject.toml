[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorius"
version = "0.26.204.8"
description = "Cross-platform environmental sensing and automation hub"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["sensorius*"]
